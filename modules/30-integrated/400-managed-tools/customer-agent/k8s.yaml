apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-agent
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-agent
  template:
    metadata:
      labels:
        app: customer-agent
    spec:
      serviceAccountName: agent
      containers:
        - name: customer-agent
          image: ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/customer-agent:agentcore-tools
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: agent-config
            - configMapRef:
                name: agent-tools
          resources:
            requests:
              cpu: "256m"
              memory: "512Mi"
            limits:
              cpu: "512m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: customer-agent
  namespace: agents
spec:
  selector:
    app: customer-agent
  ports:
    - port: 8080
      targetPort: 8080
