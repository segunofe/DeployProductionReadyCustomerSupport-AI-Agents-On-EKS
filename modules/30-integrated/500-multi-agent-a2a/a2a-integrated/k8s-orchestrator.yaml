apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-agent
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-agent
  template:
    metadata:
      labels:
        app: orchestrator-agent
    spec:
      serviceAccountName: agent
      containers:
        - name: orchestrator-agent
          image: ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/orchestrator-agent:bedrock
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: agent-config
          resources:
            requests: { cpu: "256m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-agent
  namespace: agents
spec:
  selector:
    app: orchestrator-agent
  ports:
    - port: 8083
      targetPort: 8083
